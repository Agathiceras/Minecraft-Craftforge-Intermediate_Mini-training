<title>Kodland Sparks · Publish a Minecraft project</title>
<script>
/* Language: ?lang=xx loads assets/content-xx.js (falls back to English, the base version)
   Flow: ?flow=image (Beginner: a skin and a build published in Kodland Sparks) or ?flow=datapack (Intermediate: a data pack published from the Kodland Launcher) */
(function(){ var m = /[?&]lang=([a-z]{2}(?:-[A-Za-z]{2})?)/.exec(location.search); window.LANG = m ? m[1] : 'en';
  var f = /[?&]flow=(image|datapack)/.exec(location.search); window.FLOW = f ? f[1] : 'image';
  document.write('<script src="assets/content-' + LANG + '.js"><\/script>'); })();
</script>
<script>if (!window.CONTENT){
  if (LANG !== 'en') document.addEventListener('DOMContentLoaded', function(){ var b = document.createElement('div');
    b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#E5484D;color:#fff;font:600 14px/1.4 system-ui,sans-serif;padding:10px 16px;text-align:center';
    b.textContent = '⚠ assets/content-' + LANG + '.js could not be loaded (missing file or an error inside it). Showing the base version (content-en.js) instead.'; document.body.appendChild(b); });
  window.LANG = 'en'; document.write('<script src="assets/content-en.js"><\/script>'); }</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Replicas of Kodland Sparks v0.11.0 (light), the Kodland Launcher 0.8.20 (dark) and the lesson card on the Kodland platform, plus the guide layer */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:#1d1f27;font-family:Inter,system-ui,sans-serif}
body{display:flex;flex-direction:column}
#scroller{flex:1;overflow:auto;position:relative}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
/* Window strip (tabs) + browser address bar */
.win{flex:0 0 auto;background:#dfe3ea;padding:6px 10px 0;display:flex;gap:6px;align-items:flex-end}
.win button{background:#eef1f5;border-radius:10px 10px 0 0;padding:8px 14px;font-size:13px;font-weight:600;color:#4b5263;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win button.cur{background:#fff;color:#111}
.addr{flex:0 0 auto;background:#fff;border-bottom:1px solid #e6e8ee;display:flex;gap:10px;align-items:center;padding:7px 14px}
.addr .nav{color:#9aa0ab;font-size:15px;letter-spacing:6px}
.addr .bar{flex:1;display:flex;align-items:center;gap:8px;background:#f1f3f6;border:2px solid transparent;border-radius:999px;padding:6px 14px;font-size:13.5px;color:#333;min-width:0;text-align:left}
.addr .bar code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Inter,system-ui,sans-serif}
.addr .bar.sel{border-color:#7c5cff;background:#fff}.addr .bar.sel code{background:#c9d9ff}
/* Sparks */
.top{flex:0 0 auto;background:#fff;border-bottom:1px solid #eef0f3;display:flex;align-items:center;gap:14px;padding:10px 28px}
.brand b{font-size:17px;font-weight:800}.brand sup{font-size:11px;color:#888}.brand small{display:block;font-size:10.5px;color:#999}
.navl{display:flex;gap:6px;margin:0 auto;align-items:center}
.navl button{padding:8px 13px;border-radius:999px;font-weight:600;font-size:14.5px}
.navl button.cur,.navl button:hover{background:#f3f4f6}
.navl .studio{border:1.5px solid #8fb2f5;color:#3b73f0}
.navl .aih{background:#20b979;color:#fff;display:flex;gap:6px;align-items:center}
.navl .aih i{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#2d5a3d,#9ad1a8);display:inline-block}
.navl .gems{background:#8b5cf6;color:#fff;font-weight:800;min-width:56px}
.av{width:34px;height:34px;border-radius:50%;background:#f59e0b;color:#fff;display:grid;place-items:center;font-weight:800;font-style:normal}
.bell{width:34px;height:34px;border-radius:50%;border:1px solid #eee;display:grid;place-items:center}
main{max-width:1180px;margin:0 auto;padding:22px 28px 160px}
.hero{background:#8b5cf6;color:#fff;border-radius:24px;padding:22px 26px;margin-bottom:22px}
.hero b{font-size:17px}.hero p{margin:6px 0 0;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pc{border:1px solid #ececec;border-radius:18px;overflow:hidden;text-align:left;background:#fff;width:100%}
.pc .th{height:150px;position:relative;display:grid;place-items:center;overflow:hidden}
.pc .tags{position:absolute;left:8px;top:8px;display:flex;gap:6px}
.pc .tags span{background:#fff;border-radius:999px;font-size:11.5px;font-weight:700;padding:3px 8px}
.pc .bd{padding:10px 12px}.pc .bd b{display:block;font-size:14px;margin-top:6px}.pc .bd small{color:#666;font-size:12.5px}
.form{max-width:760px;margin:0 auto;border:1px solid #e6e8ee;border-radius:22px;padding:22px 22px 26px}
.form h2{margin:0 0 4px;font-size:26px;font-weight:600}.form h2 span{color:#3b82f6}
.form .sub{color:#6b7080;margin:0 0 14px;font-size:14.5px}
.fl{font-weight:600;font-size:14.5px;margin:16px 0 6px;display:block}
.fi{width:100%;border:1px solid #e6e8ee;border-radius:12px;padding:10px 14px;font-size:14.5px;background:#fff;text-align:left;display:block;min-height:42px}
.fi.empty{color:#9aa0ab}
.hint{font-size:12.5px;color:#6b7080;margin-top:5px}
.ptypes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ptypes button{border:1px solid #eef0f3;border-radius:16px;padding:16px 12px;text-align:center;min-height:120px}
.ptypes button i{font-style:normal;font-size:24px;display:block}
.ptypes button b{display:block;margin:8px 0 4px;font-weight:600}
.ptypes button small{font-size:12.5px;color:#6b7080;line-height:1.4;display:block}
.ptypes button.sel{background:#f3f3f4;border-color:#222}
.drop{border:0;background:#f7f7f8;border-radius:16px;padding:20px;text-align:center;color:#6b7080;width:100%}
.drop b{color:#1d1f27}
.drop.done{background:#f3fbf6;border:1px solid #bfe8cc;color:#227a45;display:flex;gap:14px;align-items:center;text-align:left}
.model{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.model span{border:1px solid #eef0f3;border-radius:999px;padding:11px;text-align:center;font-weight:600}
.model span.sel{background:#f3f3f4;border-color:#222}
.chipsr{display:flex;gap:8px;flex-wrap:wrap}
.chipsr span{border:1px solid #bbb;border-radius:999px;padding:7px 12px;font-size:14px}
.frcol{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.frcol span{border-radius:999px;padding:6px 12px;font-size:14px;color:#aaa}
.frcol span.def{border:1px solid #333;color:#111}
.vis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vis button{border:1px solid #d9e2f5;border-radius:14px;padding:12px;text-align:left;min-height:96px}
.vis button b{display:block;margin:6px 0 4px;font-size:14px}
.vis button small{font-size:12px;color:#6b7080;line-height:1.4;display:block}
.vis .pubv b,.vis .frv b{color:#3b73f0}
.vis button.sel{background:#eff5ff;border-color:#3b82f6}
.vis .mev.sel{background:#f3f3f3;border-color:#bbb}
.tg{display:flex;gap:14px;align-items:center;border:1px solid #eef0f3;border-radius:16px;padding:14px 16px;margin-top:12px;text-align:left;width:100%}
.tg div{flex:1}.tg b{display:block;font-weight:600;font-size:15px}.tg small{font-size:12.5px;color:#6b7080;line-height:1.45;display:block;margin-top:3px}
.tg i{width:46px;height:26px;border-radius:999px;background:#e9edf5;position:relative;flex:0 0 46px}
.tg i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tg.on i{background:#3b82f6}.tg.on i::after{left:23px}
.tg.dc.on{background:#f3f7ff;border-color:#8fb2f5}
.bigpub{width:100%;margin-top:18px;background:#8b5cf6;color:#fff;border-radius:999px;padding:13px;font-weight:800;font-size:16px}
.bigsave{width:100%;margin-top:18px;border:1px solid #e6e8ee;border-radius:999px;padding:12px;font-weight:600}
.proj{max-width:900px;margin:0 auto}
.proj h1{font-size:30px;margin:0 0 14px}
.proj .img{border-radius:22px;overflow:hidden;display:grid;place-items:center}
.pacts{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pacts span,.pacts button{border:1px solid #eee;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.pacts .edit{background:#f1f1f3}
.pacts .pubtag{background:#eefaf1;border-color:#bfe8cc;color:#2f9d52}
.byline{display:flex;justify-content:space-between;color:#666;font-size:14px;align-items:center}
.byline span{display:flex;gap:8px;align-items:center}
/* Profile ("My projects") */
.prof{display:flex;gap:18px;align-items:center;margin-bottom:22px}
.prof .av{width:80px;height:80px;font-size:30px}.prof h1{margin:0;font-size:26px}.prof small{color:#777;display:block}
.prof .views{display:inline-block;margin-top:6px;background:#f3f4f6;border-radius:999px;padding:2px 10px;font-size:12.5px;color:#555}
.mywrap{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
.box{border:1px solid #ececec;border-radius:18px;margin-bottom:14px;overflow:hidden}
.box h4{margin:0;padding:12px 16px;border-bottom:1px solid #f0f0f0;font-size:14.5px}
.box .in{padding:12px 16px;font-size:13.5px;color:#666}
.box .tabs2{display:flex;gap:6px;margin-bottom:10px}.box .tabs2 span{flex:1;text-align:center;border-radius:999px;padding:6px;font-size:12.5px}.box .tabs2 span:first-child{background:#eee;color:#222}
.mygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
/* Lesson card on the Kodland platform */
.plat{background:#2b2f3c;min-height:calc(100vh - 92px);padding:26px 20px 160px;color:#e8eaf0}
.plat .pw{max-width:760px;margin:0 auto}
.plat .gif{display:block;width:100%;max-width:620px;margin:0 auto 22px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.plat h3{margin:0 0 12px;font-size:17px;font-weight:700}
.plat .ans{width:100%;min-height:150px;background:transparent;border:1.5px solid #8b90a0;border-radius:16px;padding:14px 16px;text-align:left;vertical-align:top;color:#9aa0b0;font-size:15px;display:block;word-break:break-all}
.plat[dir=rtl] .ans{text-align:right}
.plat .ans.filled{color:#fff;border-color:#C4F046}
.plat .cnt{font-size:13px;color:#aab0bd;margin-top:10px}
/* Kodland Launcher 0.8.20 (dark) */
.ln{min-height:calc(100vh - 40px);padding-bottom:160px;background:radial-gradient(1200px 600px at 60% 20%,#1d2040 0%,#121426 60%,#0e1020 100%);color:#e8eaf0}
.lhd{display:flex;align-items:center;padding:10px 16px;font-size:11.5px;letter-spacing:.12em;color:#aab0c4;font-weight:700}
.lhd small{letter-spacing:0;font-weight:500;margin-left:6px}.lhd u{margin-left:10px;letter-spacing:0;font-weight:500}
.lhd .lang{margin-left:auto;background:#2a2e44;border-radius:999px;padding:5px 12px;letter-spacing:0;color:#fff;font-weight:600;font-size:12.5px}
.ltabs{display:flex;justify-content:center;gap:24px;border-bottom:1px solid #262a40}
.ltabs button{padding:8px 4px 10px;font-weight:700;color:#9aa0b8;border-bottom:2px solid transparent}
.ltabs button.cur{color:#fff;border-color:#8b5cf6}
.lplay{display:grid;grid-template-columns:230px 1fr 230px;gap:16px;padding:18px 16px}
.lplay h6{margin:0 0 12px;font-size:11px;letter-spacing:.12em;color:#9aa0b8}
.wcard{display:flex;gap:10px;align-items:center;background:#22253a;border-radius:16px;padding:12px;margin-bottom:10px;border:1px solid transparent}
.wcard.sel{border-color:#8b5cf6;background:#272a45}
.wcard i{width:36px;height:36px;border-radius:8px;flex:0 0 36px;font-style:normal;display:grid;place-items:center;font-size:18px}
.wcard b{display:block;font-size:14px}.wcard small{color:#9aa0b8;font-size:11.5px}
.banner{border-radius:18px;padding:20px 22px;background:linear-gradient(120deg,#20254a,#3b2a6b 55%,#1b6a8a);display:flex;gap:16px;align-items:center}
.banner div{flex:1}.banner b{font-size:22px;display:block;margin-bottom:6px}.banner p{margin:0;font-size:13px;color:#d8dcf0;line-height:1.45}
.banner span{border:1px solid #e8eaf0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:13px;white-space:nowrap}
.wrow{margin-top:10px;background:#22253a;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.wrow i{width:44px;height:44px;border-radius:50%;background:linear-gradient(#5aa0e8,#3c8a3c);flex:0 0 44px}
.wrow div{flex:1}.wrow b{display:block}.wrow small{color:#9aa0b8;font-size:12px}
.lplaybtn{background:#7c5cff;color:#fff;border-radius:999px;padding:9px 20px;font-weight:800}
.signed{font-size:11px;letter-spacing:.12em;color:#9aa0b8;font-weight:700}
.signed .av{background:#6f6cf6;width:40px;height:40px;margin-top:12px}
.lsub{display:flex;align-items:center;gap:12px;padding:10px 16px}
.lsub .back{border:1px solid #3a3f5a;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.lsub b{font-size:14px}.lsub .nm{font-size:15.5px;font-weight:800}
.lsub .sp{flex:1}
.lstrip{background:#2a2350;padding:7px 16px;font-size:13px;color:#e8e4ff}
.lbtn{border:1px solid #c9cbe0;border-radius:999px;padding:7px 15px;font-weight:700;font-size:13.5px}
.lsave{background:#7c5cff;color:#fff;border-radius:999px;padding:8px 18px;font-weight:800;font-size:13.5px}
.lopen{color:#8b7bff;font-weight:600;font-size:13.5px}
.packs{padding:14px 16px}
.packs .ph{display:flex;align-items:center;margin-bottom:14px}.packs .ph b{font-size:13px;flex:1}
.packs .ph span{background:#7c5cff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}
.pkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.pk{border:1px solid #2f3350;border-radius:18px;overflow:hidden;background:#171a2e}
.pk .pv{height:190px;display:grid;place-items:center;font-size:24px;letter-spacing:6px}
.pk .pb{background:#22253a;padding:12px 14px}.pk .pb b{display:block}.pk .pb small{color:#9aa0b8;display:block;margin:6px 0 10px}
.pk .row{display:flex;gap:8px}.pk .row span{flex:1;text-align:center;background:#34375a;border-radius:999px;padding:6px;font-size:12.5px;font-weight:700}
.pk .row button{border:1px solid #3a3f5a;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700}
.pk .del{display:block;text-align:center;color:#9aa0b8;font-size:12px;margin-top:8px}
.pk.make{display:grid;place-items:center;color:#9aa0b8;font-weight:700;min-height:280px}
.ed{display:grid;grid-template-columns:170px 1fr;gap:12px;padding:12px 10px}
.ed aside h6{margin:4px 6px 8px;font-size:11px;letter-spacing:.1em;color:#9aa0b8}
.ed aside span{display:block;background:#262a40;border-radius:999px;padding:7px 12px;font-size:13px;margin-bottom:8px}
.ed aside span.add{background:none;border:1px solid #2f3350;text-align:center}
.rcp{background:#1f2235;border-radius:16px;padding:16px 18px}
.rcp .top2{display:flex}.rcp .top2 b{flex:1}.rcp .top2 small{color:#9aa0b8}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pills span{background:#2c3048;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700}.pills span.on{background:#7c5cff}
.rgrid{display:flex;gap:60px;flex-wrap:wrap;margin-top:8px}
.rgrid h6{margin:0 0 8px;font-size:12.5px;color:#d8dcf0}
.cg{display:grid;grid-template-columns:repeat(3,38px);gap:6px}
.cg i{width:38px;height:38px;border-radius:9px;border:1.5px dashed #3a3f5a;display:grid;place-items:center;font-style:normal;font-size:18px}
.cg i.f{border-style:solid;background:#2c3048}
.res{display:flex;gap:10px;align-items:center}.res i{width:46px;height:46px;border-radius:9px;background:#2c3048;display:grid;place-items:center;font-style:normal;font-size:22px}
.res span{background:#2c3048;border-radius:999px;padding:7px 20px}
.rcp .nm2{margin-top:14px;background:#2c3048;border-radius:999px;padding:9px 14px;color:#8a8fa8;max-width:360px}
.dlg{position:absolute;inset:0;z-index:30;background:rgba(5,6,14,.55);display:grid;place-items:center}
.dlg .bx{width:min(370px,92vw);background:#23263a;color:#e8eaf0;border:1px solid #33375a;border-radius:18px;padding:16px 18px}
.dlg h3{margin:0 0 12px;font-size:14.5px}
.dlg label{display:block;font-size:12.5px;margin:10px 0 6px;color:#d8dcf0}
.dlg .in{width:100%;background:#2c3048;border-radius:999px;padding:8px 12px;font-size:13px;text-align:left;color:#fff;display:block;min-height:34px}
.dlg .in.empty{color:#8a8fa8}
.dlg .ta{border-radius:14px;min-height:52px;color:#8a8fa8}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who button{border:1px solid #3a3f5a;border-radius:999px;padding:7px;font-weight:700;font-size:13px;background:#2c3048}
.who button.sel{border-color:#9b8cff;background:#34306a}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.dlg .acts button{border:1px solid #c9cbe0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px}
.dlg .acts .pp{background:#7c5cff;border-color:#7c5cff;color:#fff}
.dlg .ok{color:#4ade80;font-size:13px;margin:0 0 10px}
.dlg code{display:block;background:#2c3048;border-radius:12px;padding:9px 12px;font-size:11.5px;word-break:break-all;color:#e8eaf0}
.dlg .gem{color:#facc15;font-weight:700;font-size:13px;margin:10px 0 0}
/* Guide layer */
#spot{position:fixed;z-index:40;pointer-events:none;border-radius:14px;box-shadow:0 0 0 4px #C4F046,0 0 0 9999px rgba(17,17,17,.35);display:none}
#coach{position:fixed;z-index:50;right:18px;bottom:18px;width:370px;max-width:calc(100vw - 36px);background:#fff;color:#1d1f27;border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.3),0 0 0 2px #111;border-top:6px solid #C4F046;padding:16px 18px}
#coach .cs{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#5E7F07}
#coach h4{margin:6px 0 6px;font-size:17px}
#coach .ct{font-size:14px;line-height:1.55;color:#3a4052}
#coach .ct ul{margin:6px 0;padding-left:0;padding-inline-start:18px}
code{direction:ltr;unicode-bidi:isolate}
#coach .cf{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
#coach .hint{font-size:12.5px;color:#5E7F07;font-weight:700}
#coach .nx{background:#111;color:#fff;border-radius:999px;padding:9px 16px;font-weight:700}
#coach .nx:hover{background:#F03D9E}
#toast{position:fixed;z-index:60;top:96px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{border-radius:14px;padding:10px 18px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.15);animation:tin .3s}
#toast .ok{background:#e8f8ee;color:#227a45;border:1px solid #bfe8cc}#toast .gem{background:#8b5cf6;color:#fff}#toast .no{background:#fff7e6;color:#7a4a00;border:1px solid #ffd68a}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
#intro,#end{position:fixed;inset:0;z-index:70;background:#E8FABD;display:none;overflow:auto}
.iw{max-width:760px;margin:0 auto;padding:46px 24px}
.ik{display:inline-block;background:#111;color:#C4F046;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:6px 14px}
.iw h1{font-size:38px;line-height:1.15;margin:16px 0 12px}.iw h1 span{background:#C4F046;padding:0 10px;border-radius:10px;box-shadow:0 0 0 2px #111 inset}
.iw p{font-size:16.5px;line-height:1.65;color:#3a3a3a}
.ib{background:#fff;border:2px solid #D8F07A;box-shadow:0 6px 0 #BFE15A;border-radius:18px;padding:18px 22px;margin:20px 0}

.ibtn{background:#111;color:#fff;border-radius:999px;padding:15px 30px;font-weight:800;font-size:16px}

<body>
<nav class="win" id="win"></nav>
<div class="addr" id="addr"></div>
<header class="top" id="top"></header>
<div id="scroller"><main id="app"></main><div id="dlg"></div></div>
<div id="spot"></div>
<div id="coach"></div>
<div id="toast"></div>
<div id="intro"></div>
<div id="end"></div>
<script>
'use strict';
const T = CONTENT.ui, F = CONTENT.flows[FLOW], ST = F.steps;
document.documentElement.lang = CONTENT.lang;
// Arabic and other right-to-left languages: CONTENT.dir = 'rtl' in the language file (the replicated interfaces stay left-to-right)
if (CONTENT.dir === 'rtl') ['#coach', '#intro', '#end'].forEach(s => { const el = document.querySelector(s); if (el) el.dir = 'rtl'; });
document.title = T.title;
const $ = (s, r = document) => r.querySelector(s);

/* ---------- Minecraft-style pictures drawn as pixel blocks ---------- */
const TOWER = ['................','.......yy.......','......yyyy......','.....wwwwww.....','.....w....w.....','.....wwwwww.....','......b..b......','......bllb......','......b..b......','......bllb......','......b..b......','......bllb......','......b..b......','gggggggggggggggg','dddddddddddddddd'];
const HOUSE = ['.......rr.......','......rrrr......','.....rrrrrr.....','....rrrrrrrr....','....bbbbbbbb....','....bwwbbwwb....','....bbbbbbbb....','....bbbddbbb....','....bbbddbbb....','gggggggggggggggg','dddddddddddddddd'];
const SKIN = ['....hhhhhhhh....','....hhhhhhhh....','....hsssssshh...','....sewsswes....','....ssssssss....','....ssmmmmss....','....cccccccc....','..aacccyycccaa..','..aaccccccccaa..','..sscccyycccss..','..ss.cccccc.ss..','.....pppppp.....','.....ppp.ppp....','.....ppp.ppp....','.....kkk.kkk....'];
const COL = { '.':null, y:'#facc15', w:'#e5e7eb', b:'#a16207', l:'#78350f', g:'#22c55e', d:'#7c4a1e', r:'#b91c1c',
  h:'#3f2a14', s:'#e0ac7e', e:'#1d4ed8', m:'#9a5b3c', c:'#16a34a', a:'#15803d', p:'#1e3a8a', k:'#374151' };
const pixel = (rows, bg, size) => { const w = rows[0].length, h = rows.length, c = size / Math.max(w, h);
  return `<svg width="${w * c}" height="${h * c}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" style="background:${bg};display:block">${rows.map((r, y) => [...r].map((ch, x) => COL[ch] ? `<rect x="${x}" y="${y}" width="1" height="1" fill="${COL[ch]}"/>` : '').join('')).join('')}</svg>`; };

/* ---------- State ---------- */
const S = { tab:'main', step:0, screen:FLOW === 'image' ? 'feed' : 'lplay',
  ptype:null, part:'skin', title:'', uploaded:false, vis:'public', fixing:false, done:{}, old:{ vis:'me' },
  copied:false, pasted:false, dlg:null, gems:3, packVis:'public', published:false, sparks:false };
const SLUG = { skin:'cmskin5k01sparks', image:'cmtower8x01sparks', old:'cmhouse4q02sparks', pack:'cmlawpack3q02sparks' };
const url = key => `https://portfolio.kodland.org/${T.studentNick}/${SLUG[key]}`;

/* ---------- Guided steps: what to click (act) and where (target). Texts: CONTENT.flows[flow].steps[id] ---------- */
const STEPS = FLOW === 'image' ? [
  { id:'start', next:true },
  { id:'navPublish', act:'nav:new', target:'#nNew' },
  { id:'typeSkin', act:'type:skin', target:'#ptSkin' },
  { id:'title', act:'title', target:'#fTitle' },
  { id:'model', next:true, target:'#fModel' },
  { id:'upload', act:'upload', target:'#fUpload' },
  { id:'visibility', next:true, target:'#fVis' },
  { id:'visPublic', act:'vis:public', target:'#vPub' },
  { id:'toggles', next:true, target:'#fTg' },
  { id:'publish', act:'submit', target:'#bSubmit' },
  { id:'findMy', act:'nav:my', target:'#nMy' },
  { id:'openSkin', act:'open:skin', target:'#cSkin' },
  { id:'copy', act:'copy', target:'#aBar' },
  { id:'toCard', act:'tab:card', target:'#tCard' },
  { id:'paste', act:'paste', target:'#cAns' },
  { id:'imageIntro', act:'tab:main', target:'#tMain' },
  { id:'navPublish2', act:'nav:new', target:'#nNew' },
  { id:'typeImage', act:'type:image', target:'#ptImage' },
  { id:'title2', act:'title', target:'#fTitle' },
  { id:'upload2', act:'upload', target:'#fUpload' },
  { id:'publish2', act:'submit', target:'#bSubmit' },
  { id:'problem', next:true },
  { id:'myProjects', act:'nav:my', target:'#nMy' },
  { id:'privateCard', act:'open:old', target:'#cOld' },
  { id:'edit', act:'edit', target:'#bEdit' },
  { id:'fixPublic', act:'vis:public', target:'#vPub' },
  { id:'resend', act:'submit', target:'#bSubmit' },
  { id:'done', next:true, target:'#aBar', last:true }
] : [
  { id:'start', next:true },
  { id:'create', act:'ltab:create', target:'#lCreate' },
  { id:'edit', act:'ledit', target:'#lEdit' },
  { id:'editor', next:true, target:'#lTop' },
  { id:'publish', act:'openPub', target:'#lPub' },
  { id:'name', act:'title', target:'#dName' },
  { id:'who', next:true, target:'#dWho' },
  { id:'everyone', act:'vis:public', target:'#dEvery' },
  { id:'submit', act:'submit', target:'#dGo' },
  { id:'copy', act:'copy', target:'#dCopy' },
  { id:'close', act:'close', target:'#dDone' },
  { id:'toCard', act:'tab:card', target:'#tCard' },
  { id:'paste', act:'paste', target:'#cAns' },
  { id:'problem', next:true },
  { id:'backLauncher', act:'tab:main', target:'#tMain' },
  { id:'republish', act:'openPub', target:'#lPub' },
  { id:'fixEveryone', act:'vis:public', target:'#dEvery' },
  { id:'resubmit', act:'submit', target:'#dGo' },
  { id:'lostLink', act:'opensp', target:'#dOpen' },
  { id:'done', next:true, target:'#aBar', last:true }
];

/* ---------- Window strip, address bar and Sparks top bar ---------- */
function chrome(){
  const tabs = [];
  if (FLOW === 'image') tabs.push(['tMain', 'main', '⚡ Kodland Sparks']);
  else { tabs.push(['tMain', 'main', '🟪 Kodland Launcher']); if (S.sparks) tabs.push(['tSp', 'sparks', '⚡ Kodland Sparks']); }
  tabs.push(['tCard', 'card', '📘 ' + T.cardTab]);
  $('#win').innerHTML = tabs.map(t => `<button id="${t[0]}" data-act="tab:${t[1]}" class="${S.tab === t[1] ? 'cur' : ''}">${t[2]}</button>`).join('');
  const inSparks = FLOW === 'image' ? S.tab === 'main' : S.tab === 'sparks', browser = S.tab === 'card' || inSparks;
  let u = T.cardUrl;
  if (inSparks){ const sc = S.screen; u = FLOW === 'datapack' ? url('pack') : sc === 'project' ? url(S.part) : sc === 'oldproj' ? url('old') : sc === 'my' ? `https://portfolio.kodland.org/${T.studentNick}` : sc === 'new' ? 'https://portfolio.kodland.org/projects/new' : 'https://portfolio.kodland.org/feed'; }
  const canCopy = inSparks && (FLOW === 'datapack' || S.screen === 'project' || S.screen === 'oldproj');
  $('#addr').style.display = browser ? '' : 'none';
  $('#addr').innerHTML = `<span class="nav">‹ › ⟳</span><button class="bar ${S.copied && canCopy ? 'sel' : ''}" id="aBar" ${canCopy ? 'data-act="copy"' : ''}>🔒 <code>${u}</code></button>`;
  $('#top').style.display = inSparks ? '' : 'none';
  if (inSparks) $('#top').innerHTML = `<div class="brand"><b>Kodland Sparks</b><sup>α</sup><small>v0.11.0</small></div>
    <nav class="navl"><button>Feed</button><button id="nMy" data-act="nav:my" class="${S.screen === 'my' ? 'cur' : ''}">My projects</button><button id="nNew" data-act="nav:new" class="${S.screen === 'new' ? 'cur' : ''}">Publish project</button><button class="studio">Studio</button><button class="aih"><i></i>AI helper</button><button class="gems">💎 ${S.gems}</button></nav>
    <span class="bell">🔔</span><span class="av">${T.studentInitial}</span>`;
}

/* ---------- Sparks screens ---------- */
const card = (id, title, rows, bg, tags, act) => `<button class="pc" ${id ? `id="${id}"` : ''} ${act ? `data-act="${act}"` : ''}><div class="th" style="background:${bg}">${pixel(rows, bg, 130)}<div class="tags">${tags.map(t => `<span>${t}</span>`).join('')}</div></div><div class="bd"><small>💖 0 ☺</small><b>${title}</b></div></button>`;
function feed(){
  return `<div class="hero"><b>Make your profile yours</b><p>Set an avatar and pick a call sign — everyone sees it on your profile.</p></div>
    <h2 style="font-size:26px;margin:4px 0 12px">Latest Featured Projects</h2>
    <div class="grid">${card('', 'explorador', SKIN, '#e5e7eb', ['Skin'])}${card('', 'spider craft', HOUSE, '#1f2937', ['Skin'])}${card('', 'Boss a frente', TOWER, '#fde68a', ['Music'])}${card('', 'super botellini', SKIN, '#312e81', ['Scratch'])}</div>`;
}
function newProject(){
  const fixing = S.fixing, kind = fixing ? 'image' : S.ptype, skin = kind === 'skin';
  // The 8 project types of Sparks v0.11.0 (only Image and Minecraft skin are used here)
  const types = [['🖼️', 'Image', 'Upload a drawing, picture, GIF or WebP.', 'ptImage', 'image'], ['🐍', 'Python', 'Paste your Python code — visitors can run it in the browser.'], ['🎮', 'Game or Web App', '.sb3 from Scratch or .zip with Unity/Godot/HTML/Python.'],
    ['👾', 'Minecraft skin', 'Upload a 64×64 skin and show it on a 3D model.', 'ptSkin', 'skin'], ['📖', 'Story', 'A page with text, images and embeds'], ['🌐', 'Embed', 'Paste a YouTube, Vimeo, Sketchfab, Tinkercad or Canva link.'],
    ['🐙', 'GitHub', 'Link a public GitHub repository.'], ['📦', 'Other', 'If none of the types above fit — like a Roblox game or a Play Market app.']];
  const title = fixing ? T.oldTitle : S.title, me = S.vis === 'me', pub = S.vis === 'public';
  const file = fixing ? ['house.png', HOUSE, '#bfe3ff'] : skin ? [T.skinFile, SKIN, '#2b2f3a'] : [T.fileName, TOWER, '#bfe3ff'];
  const tg = (on, b, s, cls) => `<div class="tg ${on ? 'on' : ''} ${cls || ''}"><div><b>${b}</b><small>${s}</small></div><i></i></div>`;
  return `<div class="form"><h2>${fixing ? 'Edit' : 'New'} <span>project</span></h2><p class="sub">Pick a project type, fill in the details, and choose who can see it.</p>
    ${fixing ? '' : `<label class="fl">Project type</label><div class="ptypes">${types.map(x => `<button ${x[3] ? `id="${x[3]}" data-act="type:${x[4]}"` : ''} class="${x[4] && x[4] === kind ? 'sel' : ''}"><i>${x[0]}</i><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div>`}
    ${kind ? `<label class="fl">Title</label><button class="fi ${title ? '' : 'empty'}" id="fTitle" data-act="title">${title || '&nbsp;'}</button><div class="hint">${30 - (title || '').length} characters left</div>
      <label class="fl">Description</label><div class="fi empty" style="min-height:62px"></div><div class="hint">240 characters left</div>
      ${skin ? `<div id="fModel"><label class="fl">Model</label><div class="model"><span class="sel">Steve</span><span>Alex</span></div></div>` : ''}
      <label class="fl">${skin ? 'Skin file (PNG)' : 'Drawing'}</label>${fixing || S.uploaded ? `<div class="drop done">${pixel(file[1], file[2], 70)}<div><b>${file[0]}</b><br><small>${T.uploaded}</small></div></div>` : `<button class="drop" id="fUpload" data-act="upload"><b>Choose file</b><br><small>${skin ? '64×64 PNG (legacy 64×32 also works).' : 'PNG, JPG, WebP or GIF up to 5 MB'}</small></button>`}
      <label class="fl">📁 Section</label><div class="fi">No section ▾</div><div class="hint">Sections help group your projects on your profile page.</div>
      <label class="fl">Reactions</label><div class="hint" style="margin:-2px 0 8px">Pick which reactions viewers can leave on this project.</div>
      <div class="chipsr"><span>💖 Heart is always available</span><span>👍</span><span>😁</span><span>🔥</span><span>💀</span><span>🦄</span></div>
      <label class="fl">Appearance</label><div class="hint" style="margin:-2px 0 4px">Choose a frame color to highlight your project card in the feed.</div><div class="hint"><b style="color:#1d1f27">5 of 5 frame slots available</b></div>
      <div class="frcol"><span class="def">● Default</span><span>🔒 Sky</span><span>🔒 Emerald</span><span>🔒 Violet</span><span>🔒 Red</span><span>🔒 Lavender</span><span>🔒 Pink</span><span>🔒 Gray</span></div>
      <div id="fVis"><label class="fl">Visibility</label>
      <div class="vis"><button id="vPub" class="pubv ${pub ? 'sel' : ''}" data-act="vis:public">🌐<b>Public</b><small>Appears in the feed and on your public portfolio.</small></button>
        <button id="vFr" class="frv ${S.vis === 'friends' ? 'sel' : ''}" data-act="vis:friends">👥<b>Friends only</b><small>Visible to your friends, your teachers, and you.</small></button>
        <button id="vMe" class="mev ${me ? 'sel' : ''}" data-act="vis:me">🙈<b>Only me</b><small>Visible only to you on your portfolio.</small></button></div></div>
      <div id="fTg">${me ? '' : tg(false, 'Request feedback', 'Other authors will be able to leave structured feedback on your project. Available for public projects only.')}
        ${tg(false, 'I’m OK with Kodland Sparks using this project in promotions', 'For example, it might appear in our social media, ads, or on the main page to show other kids what’s possible here. You can change this anytime.')}
        ${tg(true, 'Others can modify this project', 'Anyone who can see the project can open their own copy in the Studio and build on it. Your original stays untouched. You can change this anytime.', 'dc')}
        ${pub ? tg(true, 'Take part in the Discord selection', 'Once a day we post the day’s best projects to our Discord server. Keep this on and yours can be picked too. Public projects only.', 'dc') : ''}</div>
      ${me ? `<button class="bigsave" id="bSubmit" data-act="submit">Save</button>` : `<button class="bigpub" id="bSubmit" data-act="submit">1× 💎 Publish</button>`}` : ''}</div>`;
}
function project(){
  if (FLOW === 'datapack') return `<div class="proj"><h1>${T.packName}</h1><div class="img" style="background:#171a2e;color:#e8eaf0;padding:46px 20px;font-size:30px;letter-spacing:8px">🍎 → ▦</div>
    <div class="pacts"><span class="pubtag">🌐 Public</span><span>📦 Data pack</span></div>
    <div class="byline"><span><i class="av" style="width:30px;height:30px;font-size:13px">${T.studentInitial}</i><b>${T.studentNick}</b></span><span>${T.uploaded2}</span></div></div>`;
  const old = S.screen === 'oldproj', key = old ? 'old' : S.part, priv = old ? S.old.vis === 'me' : false;
  const title = old ? T.oldTitle : key === 'skin' ? T.skinTitle : T.towerTitle;
  const pic = key === 'skin' ? `<div style="padding:24px">${pixel(SKIN, '#2b2f3a', 300)}</div>` : pixel(key === 'old' ? HOUSE : TOWER, '#bfe3ff', 320);
  return `<div class="proj"><h1>${title}</h1><div class="img" style="background:${key === 'skin' ? '#2b2f3a' : '#bfe3ff'}">${pic}</div>
    <div class="pacts">${priv ? '<span>Private project</span>' : '<span class="pubtag">🌐 Public</span>'}<span>⭳ Download</span><button class="edit" id="bEdit" data-act="edit">✎ Edit</button></div>
    <div class="byline"><span><i class="av" style="width:30px;height:30px;font-size:13px">${T.studentInitial}</i><b>${T.studentNick}</b></span><span>${T.uploaded2}</span></div></div>`;
}
function my(){
  const cards = (S.done.skin ? card('cSkin', T.skinTitle, SKIN, '#2b2f3a', ['Skin'], 'open:skin') : '')
    + (S.done.image ? card('cTower', T.towerTitle, TOWER, '#bfe3ff', ['PNG'], 'open:image') : '')
    + card('cOld', T.oldTitle, HOUSE, '#bfe3ff', S.old.vis === 'me' ? ['PNG', 'Private project'] : ['PNG'], 'open:old');
  return `<div class="prof"><span class="av">${T.studentInitial}</span><div><h1>${T.studentNick}</h1><small>${T.studentName}</small><span class="views">👁 2</span></div></div>
    <div class="mywrap"><div><div class="box"><h4>Friends</h4><div class="in"><div class="tabs2"><span>Friends (0)</span><span>Subscribers (0)</span></div><div style="text-align:center">No friends yet</div></div></div>
      <div class="box"><h4>Activity</h4><div class="in"><small style="letter-spacing:.06em">OCTOBER 26, 2026</small><br>${T.studentNick} published a project</div></div></div>
      <div class="mygrid">${cards}</div></div>`;
}
/* ---------- The lesson card on the Kodland platform ---------- */
function platform(){
  const C = F.card, link = FLOW === 'datapack' ? url('pack') : url('skin');
  return `<div class="plat" dir="${CONTENT.dir || 'ltr'}"><div class="pw"><img class="gif" src="${C.gif}" alt="">
    <h3>🏁 ${C.label}</h3>
    <button class="ans ${S.pasted ? 'filled' : ''}" id="cAns" data-act="paste">${S.pasted ? link : C.placeholder}</button>
    <div class="cnt">${T.chars(S.pasted ? link.length : 0)}</div></div></div>`;
}

/* ---------- Kodland Launcher screens ---------- */
function lhead(){
  return `<div class="lhd">KODLAND LAUNCHER <small>· 0.8.20</small><u>Check</u><span class="lang">${T.langName} ⌄</span></div>
    <div class="ltabs"><button class="${S.screen === 'lplay' ? 'cur' : ''}">Play</button><button id="lCreate" data-act="ltab:create" class="${S.screen !== 'lplay' ? 'cur' : ''}">Create</button></div>`;
}
function lplay(){
  const worlds = [['M1-Beginner', '#7fb3e0', '🏰'], ['M1-Intermediate', '#3b2a6b', '🌀'], ['M2-Beginner', '#6b4a2a', '⚙️'], ['M2-Intermediate', '#2a8a8a', '🧊'], ['A random world', '#5b3db8', '?']];
  return `<div class="ln">${lhead()}<div class="lplay"><div><h6>TEACHING WORLDS</h6>${worlds.map((w, i) => `<div class="wcard ${i === 1 ? 'sel' : ''}"><i style="background:${w[1]}">${w[2]}</i><div><b>${w[0]}</b><small>your worlds: 1</small></div></div>`).join('')}</div>
    <div><div class="banner"><div><b>M1-Intermediate</b><p>Something has gone wrong in this world. The Glitch has scrambled its rules, and the ancient voice of the Core - KOR - now speaks in fragments.</p></div><span>Make a world</span></div>
      <div class="wrow"><i></i><div><b>M1-Intermediate ✎</b><small>141 MB · not for a while</small></div><span class="lplaybtn">Play</span></div>
      <p style="font-size:12px;color:#9aa0b8">Your worlds take 737 MB · 59,017 MB free</p></div>
    <div><div class="signed">YOU ARE SIGNED IN AS<br><span class="av">${T.studentInitial}</span></div></div></div></div>`;
}
function lpacks(){
  return `<div class="ln">${lhead()}<div class="lsub"><span class="back">Back</span><b>Data packs</b></div><div class="lstrip">The pack is on. It will be in all your worlds.</div>
    <div class="packs"><div class="ph"><b>Available data packs</b><span>Create a data pack</span></div>
    <div class="pkgrid"><div class="pk"><div class="pv">🍎 → ▦</div><div class="pb"><b>Empty pack</b><small>Recipes 1</small><div class="row"><span>In the game</span><button id="lEdit" data-act="ledit">Edit</button></div><small class="del">Delete</small></div></div>
      <div class="pk make">＋<br>Make another</div></div></div></div>`;
}
function leditor(){
  const cells = ['🍎', '🍎', '', '', '', '', '', '', '🍎'];
  return `<div class="ln">${lhead()}<div class="lsub" id="lTop"><span class="back">Back</span><b>Data packs</b><span class="nm">Empty pack</span><span class="sp"></span><span style="color:#9aa0b8">✎</span>
      ${S.published ? `<span class="lopen">Open on Sparks</span>` : ''}<button class="lbtn" id="lPub" data-act="openPub">Publish</button><span class="lsave">Save</span></div>
    <div class="lstrip">${S.published ? 'Saved.' : 'The pack is on. It will be in all your worlds.'}</div>
    <div class="ed"><aside><h6>WHAT IS INSIDE</h6><span>▦ Recipe</span><span class="add">＋ Add</span></aside>
      <div class="rcp"><div class="top2"><b>Recipe</b><small>Delete</small></div><div class="pills"><span class="on">Form</span><span>Code</span></div>
        <div class="pills"><span class="on">Table, by shape</span><span>Table, any order</span><span>Furnace</span><span>Stonecutter</span></div>
        <div class="rgrid"><div><h6>Put things here</h6><div class="cg">${cells.map(c => `<i class="${c ? 'f' : ''}">${c}</i>`).join('')}</div></div>
          <div><h6>What you get</h6><div class="res"><i>▦</i>× <span>1</span></div></div></div>
        <p style="font-size:12.5px;color:#9aa0b8">Leave a slot empty and the shape has a hole in it.</p>
        <h6 style="margin:14px 0 6px;font-size:12.5px">Give it a name (if you want)</h6><div class="nm2">Excalibur</div></div></div></div>`;
}
function dialog(){
  if (!S.dlg) return '';
  if (S.dlg === 'done') return `<div class="dlg"><div class="bx"><h3>Publish to your profile</h3><p class="ok">Published! It is on your profile.</p><code>${url('pack')}</code><p class="gem">💎 Crystals: +1</p>
    <div class="acts"><button id="dCopy" data-act="copy">${S.copied ? 'Copied!' : 'Copy link'}</button><button id="dOpen" data-act="opensp">Open on Sparks</button><button class="pp" id="dDone" data-act="close">Done</button></div></div></div>`;
  return `<div class="dlg"><div class="bx"><h3>Publish to your profile</h3>
    <label>Name</label><button class="in ${S.title ? '' : 'empty'}" id="dName" data-act="title">${S.title || '&nbsp;'}</button>
    <label>About it</label><div class="in ta">What does your data pack do? (you can skip this)</div>
    <div id="dWho"><label>Who can see it?</label><div class="who"><button id="dEvery" data-act="vis:public" class="${S.packVis === 'public' ? 'sel' : ''}">Everyone</button><button data-act="vis:me" class="${S.packVis === 'me' ? 'sel' : ''}">Only me</button></div></div>
    <div class="acts"><button>Cancel</button><button class="pp" id="dGo" data-act="submit">Publish</button></div></div></div>`;
}

function render(){
  chrome();
  $('#scroller').scrollTop = 0;
  const inLauncher = FLOW === 'datapack' && S.tab === 'main';
  let html;
  if (S.tab === 'card') html = platform();
  else if (inLauncher) html = S.screen === 'lplay' ? lplay() : S.screen === 'lpacks' ? lpacks() : leditor();
  else html = FLOW === 'datapack' ? project() : S.screen === 'feed' ? feed() : S.screen === 'new' ? newProject() : S.screen === 'project' || S.screen === 'oldproj' ? project() : my();
  const full = S.tab === 'card' || inLauncher;
  $('#app').innerHTML = html;
  Object.assign($('#app').style, { maxWidth:full ? 'none' : '', padding:full ? '0' : '', minHeight:full ? '100%' : '' });
  $('#dlg').innerHTML = inLauncher ? dialog() : '';
  coach();
}

/* ---------- Guide card ---------- */
function coach(){
  const st = STEPS[S.step], tx = ST[st.id], c = $('#coach');
  c.innerHTML = `<div class="cs">${T.coachStep(S.step + 1, STEPS.length)}</div><h4>${tx.title}</h4><div class="ct">${tx.text}</div>
    <div class="cf">${st.next ? `<span></span><button class="nx" id="cNext">${st.last ? T.finish : T.next}</button>` : `<span class="hint">${T.clickHint}</span>`}</div>`;
  const nb = $('#cNext'); if (nb) nb.onclick = () => st.last ? finish() : advance();
  placeSpot();
}
function placeSpot(){
  const st = STEPS[S.step], t = st.target ? $(st.target) : null, sp = $('#spot');
  if (!t){ sp.style.display = 'none'; return; }
  t.scrollIntoView({ block:'center' });
  requestAnimationFrame(() => { const r = t.getBoundingClientRect(), p = 6;
    Object.assign(sp.style, { display:'block', left:(r.left - p) + 'px', top:(r.top - p) + 'px', width:(r.width + p * 2) + 'px', height:(r.height + p * 2) + 'px' }); });
}
addEventListener('resize', placeSpot);
// Keep the highlight on its element (fonts and the GIF can move the layout after a render)
setInterval(() => { const st = STEPS[S.step], t = st && st.target ? $(st.target) : null, sp = $('#spot'); if (!t || sp.style.display === 'none') return; const r = t.getBoundingClientRect(), p = 6; Object.assign(sp.style, { left:(r.left - p) + 'px', top:(r.top - p) + 'px', width:(r.width + p * 2) + 'px', height:(r.height + p * 2) + 'px' }); }, 250);
function toast(items){ const b = $('#toast'); b.innerHTML = items.map(x => `<div class="${x[0]}">${x[1]}</div>`).join(''); clearTimeout(toast.t); toast.t = setTimeout(() => b.innerHTML = '', 2600); }
function advance(){ S.step++; render(); }

/* ---------- Actions: the platform reacts, and the guide moves on when it's the expected click ---------- */
function perform(act){
  const [a, arg] = act.split(':');
  if (a === 'nav'){ S.screen = arg; if (arg === 'new'){ S.ptype = null; S.vis = 'public'; S.fixing = false; S.uploaded = false; S.title = ''; } }
  else if (a === 'type'){ S.ptype = arg; S.part = arg; }
  else if (a === 'title') S.title = FLOW === 'datapack' ? T.packName : S.part === 'skin' ? T.skinTitle : T.towerTitle;
  else if (a === 'upload') S.uploaded = true;
  else if (a === 'vis'){ if (FLOW === 'datapack') S.packVis = arg; else S.vis = arg; }
  else if (a === 'submit'){
    if (FLOW === 'image'){
      if (S.fixing){ S.old.vis = S.vis; S.screen = 'oldproj'; S.fixing = false; toast([['ok', '✓ ' + T.saved]]); }
      else { S.done[S.part] = true; S.screen = 'project'; S.copied = false; S.gems++; toast([['ok', '✓ ' + T.saved], ['gem', 'Earned 1× 💎']]); }
    } else { S.published = true; S.dlg = 'done'; S.copied = false; }
  }
  else if (a === 'open'){ S.screen = arg === 'old' ? 'oldproj' : 'project'; if (arg !== 'old') S.part = arg; S.copied = false; }
  else if (a === 'copy'){ S.copied = true; toast([['ok', '✓ ' + T.copied]]); }
  else if (a === 'tab') S.tab = arg;
  else if (a === 'paste') S.pasted = true;
  else if (a === 'edit'){ S.fixing = true; S.vis = S.old.vis; S.screen = 'new'; }
  else if (a === 'ltab') S.screen = 'lpacks';
  else if (a === 'ledit') S.screen = 'leditor';
  else if (a === 'openPub'){ S.dlg = 'form'; S.packVis = S.published ? 'me' : 'public'; if (!S.published) S.title = ''; }   // the second time, the pack had been published as "Only me"
  else if (a === 'close') S.dlg = null;
  else if (a === 'opensp'){ S.sparks = true; S.tab = 'sparks'; S.dlg = null; S.copied = false; }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (e.target.closest('#coach') || e.target.closest('#intro') || e.target.closest('#end')) return;
  const st = STEPS[S.step];
  if (st.act && el.dataset.act === st.act){ perform(st.act); S.step++; render(); return; }
  toast([['no', T.followStep]]);
  placeSpot();
});

/* ---------- Welcome and final screens ---------- */
function intro(){
  const w = F.welcome, el = $('#intro');
  el.innerHTML = `<div class="iw"><span class="ik">${w.kicker}</span><h1>${w.title}</h1><p>${w.lead}</p>
    <div class="ib"><h3>${w.seeTitle}</h3><ol>${w.see.map(x => `<li>${x}</li>`).join('')}</ol></div>
    <p>${w.how}</p><button class="ibtn" id="iStart">${w.start}</button></div>`;
  el.style.display = 'block';
  $('#iStart').onclick = () => { el.style.display = 'none'; render(); };
}
function finish(){
  const f = F.finish, el = $('#end');
  $('#coach').style.display = 'none'; $('#spot').style.display = 'none';
  el.innerHTML = `<div class="iw"><span class="ik">${f.kicker}</span><h1>${f.title}</h1><p>${f.intro}</p>
    <div class="ib"><ul>${f.points.map(x => `<li>${x}</li>`).join('')}</ul></div>
    <p>${f.back}</p><button class="ibtn" id="eAgain">${f.again}</button></div>`;
  el.style.display = 'block';
  $('#eAgain').onclick = () => location.reload();
  // Tell the training that the simulation is complete (inside the page, or in another tab)
  const msg = { type:'em-sim-done', sim:'mcPublish' };
  try { if (parent !== window) parent.postMessage(msg, '*'); } catch(e){}
  try { if (opener) opener.postMessage(msg, '*'); } catch(e){}
}

render();
intro();
</script>
</body>
</html>
